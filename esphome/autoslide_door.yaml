# Basic ESPHome config
esphome:
  name: esphome-autoslide-door
  friendly_name: Autoslide Door Opener
  min_version: 2025.10.0
  name_add_mac_suffix: false

# Enable logging
logger:
  level: VERY_VERBOSE
  #level: INFO

# ESP32 Configuration
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# WiFi setup
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "autoslidedoor"
    password: "CknEGleerfgu"

captive_portal:

# Enable Home Assistant API
api:
  encryption:
    key: !secret autoslide_door_encryption_key
  on_client_connected:
    - logger.log:
        format: "Client %s connected to API with IP %s"
        args: ["client_info.c_str()", "client_address.c_str()"]

# Allow Over-The-Air updates
# https://esphome.io/components/ota/esphome.html#updating-the-password
ota:
  - platform: esphome
    id: my_ota
    password: !secret ota_password

# Custom Component Definition
# Points ESPHome to your local custom_components folder
external_components:
  - source:
      type: local
      path: custom_components
    components: [ autoslide_door ]

# use this external component in home assistant
# external_components:
#   - source:
#       type: git
#       url: https://github.com/QuentinTorg/esphome_custom_components
#       ref: dev
#       path: esphome/custom_components
#     components: [ autoslide_door ]
#     refresh: 60s

uart:
  id: autoslide_uart
  tx_pin: GPIO4
  rx_pin: GPIO2
  baud_rate: 19200
#  debug:
#    direction: BOTH
#    dummy_receiver: false
#    after:
#      delimiter: "\x1B"
#    sequence:
#      - lambda: UARTDebug::log_string(direction, bytes);

autoslide_door:
  id: autoslide
  uart_id: autoslide_uart

  mode_select:
    name: "Door Mode"

  open_speed_switch:
    name: "Open Speed Slow"

  secure_pet_switch:
    name: "Secure Pet Mode"

  open_hold_duration:
    name: "Open Hold Duration"
    unit_of_measurement: "s"

  open_force:
    name: "Open Force"

  close_force:
    name: "Close Force"

  close_end_force:
    name: "Close End Force"

  open_button:
    name: "Open Door"

  motion_state:
    name: "Door Motion State"

  lock_state:
    name: "Door Lock State"

  connected:
    name: "Door Connected"
    device_class: connectivity

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      inverted: true
    name: "Pet Trigger Request"
