substitutions:
  linked_ha_device_name:
  peer_device_ha_name: unspecified-peer-hostname

esphome:
  on_boot:
    - priority: -100
      then:
        - delay: 2s
        - script.execute: mirror_to_ha_peer

binary_sensor:
  - platform: template
    id: local_on_state
    internal: true
    lambda: |-
      return id(feit_dimmer).remote_values.is_on();
    on_press:
      - script.execute: mirror_to_ha_peer
    on_release:
      - script.execute: mirror_to_ha_peer

sensor:
  - platform: template
    id: local_brightness_percent
    internal: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return roundf(id(feit_dimmer).remote_values.get_brightness() * 100.0f);
    update_interval: 50ms
    filters:
      - delta: 1.0
      - throttle: 200ms
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(feit_dimmer).remote_values.is_on();'
            then:
              - script.execute: mirror_to_ha_peer

# Subscribe to the peer's HA state/attributes.
text_sensor:
  - platform: homeassistant
    id: ha_peer_state
    entity_id: ${linked_ha_device_name}
    on_value:
      then:
        - script.execute: apply_peer_to_local

sensor:
  - platform: homeassistant
    id: ha_peer_brightness
    entity_id: ${linked_ha_device_name}
    attribute: brightness   # 0..255 in HA
    filters:
      - throttle: 200ms
    on_value:
      then:
        - script.execute: apply_peer_to_local

if no change locally, don't send to peer
on startup, send to peer if master, query from peer if slave
periodically re-sync from master to slave just in case


script:
  - id: mirror_to_ha_peer
    mode: queued
    then:
      - if:
          condition:
            and:
              - api.connected
              - lambda: |-
                  const bool local_on = id(feit_dimmer).remote_values.is_on();
                  const int local_br_pct = (int)roundf(id(feit_dimmer).remote_values.get_brightness() * 100.0f);

                  const bool peer_on = (id(ha_peer_state).state == "on");
                  int peer_br_pct = 0;
                  if (!isnan(id(ha_peer_brightness).state)) {
                    peer_br_pct = (int)roundf((id(ha_peer_brightness).state / 255.0f) * 100.0f);
                  }

                  // Send only when different.
                  if (local_on != peer_on) return true;
                  if (local_on && (abs(local_br_pct - peer_br_pct) >= 1)) return true;
                  return false;
          then:
            - if:
                condition:
                  lambda: 'return id(feit_dimmer).remote_values.is_on();'
                then:
                  - homeassistant.service:
                      service: light.turn_on
                      data:
                        entity_id: ${peer_entity_id}
                        brightness_pct: !lambda |-
                          return (int)roundf(id(feit_dimmer).remote_values.get_brightness() * 100.0f);
                else:
                  - homeassistant.service:
                      service: light.turn_off
                      data:
                        entity_id: ${peer_entity_id}

  # Apply the peer's HA state to the local light (pull from HA).
  - id: apply_peer_to_local
    mode: restart
    then:
      - lambda: |-
          const bool peer_on = (id(ha_peer_state).state == "on");
          float peer_brightness = NAN;  // 0..1
          if (!isnan(id(ha_peer_brightness).state)) {
            peer_brightness = id(ha_peer_brightness).state / 255.0f;
          }

          const bool local_on = id(feit_dimmer).current_values.is_on();
          const float local_b = id(feit_dimmer).current_values.get_brightness();

          bool need_apply = false;
          if (peer_on != local_on) {
            need_apply = true;
          } else if (peer_on && !isnan(peer_brightness) && fabs(peer_brightness - local_b) >= 0.01f) {
            need_apply = true;
          }
          if (!need_apply) return;

          if (peer_on) {
            float b = isnan(peer_brightness) ? local_b : peer_brightness;
            if (b < 0.0f) b = 0.0f;
            if (b > 1.0f) b = 1.0f;
            auto call = id(feit_dimmer).turn_on();
            call.set_brightness(b);
            call.perform();
          } else {
            id(feit_dimmer).turn_off();
          }
