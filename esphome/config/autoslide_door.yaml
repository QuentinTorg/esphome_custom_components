# see https://github.com/QuentinTorg/esphome_custom_components for source of truth

packages:
  base_config: !include
    file: package.base_config.yaml
    vars:
      device_name: autoslide-door
      friendly_name: Sliding Door
      comment: "ESPHome connected Autoslide door opener"

# ESP32 Configuration
esp32:
  #variant: esp32s3
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:
  #level: VERY_VERBOSE
  level: INFO

# Enable Home Assistant API
#
# api:
#   encryption:
#     key: !secret autoslide_door_encryption_key
#
# # Allow Over-The-Air updates
# ota:
#   - platform: esphome
#     id: my_ota
#     password: !secret ota_password

# Custom Component Definition
# Points ESPHome to your local custom_components folder for dev work
# external_components:
#   - source:
#       type: local
#       path: ../custom_components
#     components: [ autoslide_door ]

# Use this external component in home assistant
external_components:
  - source:
      type: git
      url: https://github.com/QuentinTorg/esphome_custom_components
      ref: main
      path: esphome/custom_components
    components: [ autoslide_door ]
    #refresh: 60s

uart:
  id: autoslide_uart
  # tx_pin: GPIO4 # s3 version
  # rx_pin: GPIO2 # s3 version
  # tx_pin: GPIO17 # wroom version
  # rx_pin: GPIO16 # wroom version
  tx_pin: GPIO6 # c3 version
  rx_pin: GPIO5 # c3 version
  baud_rate: 19200
#  debug:
#    direction: BOTH
#    dummy_receiver: false
#    after:
#      delimiter: "\x1B"
#    sequence:
#      - lambda: UARTDebug::log_string(direction, bytes);

autoslide_door:
  id: autoslide
  uart_id: autoslide_uart

  mode_select:
    name: "Mode"

  open_speed_switch:
    name: "Open Speed Slow"

  secure_pet_switch:
    name: "Secure Pet Mode"

  open_hold_duration:
    name: "Open Hold Duration"
    unit_of_measurement: "s"

  open_force:
    name: "Open Force"

  close_force:
    name: "Close Force"

  close_end_force:
    name: "Close End Force"

  open_button:
    name: "Open"

  motion_state:
    name: "Motion State"

  lock_state:
    name: "Lock State"

  connected:
    name: "Connected"
    device_class: connectivity

binary_sensor:
  - platform: gpio
    pin:
      #number: GPIO5 # used for s3 board
      number: GPIO7 # used for c3 board
      inverted: true
    name: "Pet Trigger Request"
