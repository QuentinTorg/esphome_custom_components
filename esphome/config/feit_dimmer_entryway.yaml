packages:
  feit_dimmer: !include
    file: package.feit_dimmer.yaml
    vars:
      device_name: entryway-dimmer
      friendly_name: Entryway
      restore_default_brightness: 'true'
      auto_off_enabled: 'true'
      auto_off_delay: 30min
