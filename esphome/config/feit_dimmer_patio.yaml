# see https://github.com/QuentinTorg/esphome_custom_components for source of truth

packages:
  feit_dimmer: !include
    file: package.feit_dimmer.yaml
    vars:
      device_name: patio-dimmer
      friendly_name: Patio
      restore_default_brightness: 'true'

time:
  - platform: homeassistant # Works standalone without HA (requires internet)
    id: ha_time

sun:
  time_id: ha_time
  latitude: !secret location_latitude
  longitude: !secret location_longitude

  # only turn off at sunrise, don't turn on at sunset
  on_sunrise:
    then:
      - light.turn_off: feit_dimmer
